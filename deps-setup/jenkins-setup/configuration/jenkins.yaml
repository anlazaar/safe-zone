jenkins:
  systemMessage: "MR-Jenk CI/CD"

  numExecutors: 0

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "myacoubi"
          name: "myacoubi"
          password: "${JENKINS_ADMIN_PASSWORD}"

        - id: "anlazaar"
          name: "anlazaar"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "myacoubi"
              - user: "anlazaar"

          - name: "developer"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
            entries: []

          - name: "viewer"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "View/Read"
            entries: []

  nodes:
    - permanent:
        name: "backend-node"
        remoteFS: "/home/anlazaar/jenkins"
        labelString: "backend"
        mode: EXCLUSIVE
        launcher:
          inbound: {}

    - permanent:
        name: "frontend-node"
        remoteFS: "/home/anlazaar/jenkins"
        labelString: "frontend"
        mode: EXCLUSIVE
        launcher:
          inbound: {}

    - permanent:
        name: "deployment-node"
        remoteFS: "/home/anlazaar/jenkins"
        labelString: "deployment"
        mode: EXCLUSIVE
        launcher:
          inbound: {}

unclassified:
  location:
    url: "${JENKINS_URL}"

  mailer:
    smtpHost: "smtp.gmail.com"
    smtpPort: 587
    useTls: true
    authentication:
      username: "${SMTP_USERNAME}"
      password: "${SMTP_PASSWORD}"

  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "SONAR_TOKEN"

tool:
  sonarRunnerInstallation:
    installations:
      - name: "SonarScanner"
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "7.2.0.5079"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "github"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub credentials"

          - string:
              id: "JWT_SECRET"
              secret: "${JWT_SECRET}"
              description: "JWT secret"

          - string:
              id: "GATEWAY_KEYSTORE_PASSWORD"
              secret: "${GATEWAY_KEYSTORE_PASSWORD}"
              description: "Gateway keystore password"

          - string:
              id: "MINIO_ROOT_USER"
              secret: "${MINIO_ROOT_USER}"
              description: "MinIO root username"

          - string:
              id: "MINIO_ROOT_PASSWORD"
              secret: "${MINIO_ROOT_PASSWORD}"
              description: "MinIO root password"

          - string:
              id: "MONGO_ROOT_USERNAME"
              secret: "${MONGO_ROOT_USERNAME}"
              description: "MongoDB root username"

          - string:
              id: "MONGO_ROOT_PASSWORD"
              secret: "${MONGO_ROOT_PASSWORD}"
              description: "MongoDB root password"

          - string:
              id: "ADMIN_NAME"
              secret: "${ADMIN_NAME}"
              description: "Application admin name"

          - string:
              id: "ADMIN_EMAIL"
              secret: "${ADMIN_EMAIL}"
              description: "Application admin email"

          - string:
              id: "ADMIN_PASSWORD"
              secret: "${ADMIN_PASSWORD}"
              description: "Application admin password"

          - string:
              id: "SONAR_TOKEN"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube Token"
